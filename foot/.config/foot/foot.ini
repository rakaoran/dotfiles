# ~/.config/foot/foot.ini
# Ported from the kitty Tokyonight Night config.

term=foot
font=JetBrainsMono Nerd Font:size=18
font-size-adjustment=1
initial-color-theme=dark
initial-window-size-pixels=1100x720
initial-window-mode=maximized
pad=0x0 center-when-maximized-and-fullscreen
bold-text-in-bright=no
selection-target=clipboard

[security]
osc52=enabled

[bell]
system=no
urgent=no
notify=no
visual=no

[scrollback]
lines=20000
multiplier=3.0

[url]
launch=xdg-open ${url}
style=curly

[cursor]
style=beam
blink=yes
blink-rate=550
beam-thickness=1.8

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors-dark]
alpha=0.75
alpha-mode=default
blur=yes

foreground=c0caf5
background=1a1b26
selection-foreground=c0caf5
selection-background=33467c
urls=73daca
cursor=1a1b26 c0caf5
flash=e0af68
flash-alpha=0.5

regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6

bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5

jump-labels=1a1b26 e0af68
scrollback-indicator=1a1b26 7aa2f7
search-box-no-match=1a1b26 f7768e
search-box-match=1a1b26 e0af68

[csd]
preferred=none
size=0
border-width=1
border-color=ff7aa2f7

[key-bindings]
spawn-terminal=Control+Shift+Return Control+Shift+t
quit=Control+Shift+w
font-increase=Control+plus Control+equal Control+KP_Add Control+Shift+plus Control+Shift+equal
font-decrease=Control+minus Control+KP_Subtract Control+Shift+minus
font-reset=Control+0 Control+KP_0 Control+Shift+0
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
show-urls-launch=Control+Shift+o

[mouse-bindings]
font-increase=Control+BTN_WHEEL_BACK
font-decrease=Control+BTN_WHEEL_FORWARD
