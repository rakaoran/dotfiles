# ~/.config/kitty/kitty.conf
# Matched to Neovim's Tokyonight Night theme and the Starship prompt palette.

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18
paste_actions replace-dangerous-control-codes
disable_ligatures never
symbol_map U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0C8,U+E0CA,U+E0CC-U+E0D7,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B1,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A8,U+F500-U+FD46,U+F0001-U+F1AF0 JetBrainsMono Nerd Font

# Window
hide_window_decorations yes
remember_window_size  yes
initial_window_width  1100
initial_window_height 720
window_padding_width  0
single_window_margin_width 0
window_border_width   1px
draw_minimal_borders  yes
placement_strategy    center
confirm_os_window_close 0

# Background
background_opacity 0.75
dynamic_background_opacity yes
background_blur 19

# Cursor
cursor #c0caf5
cursor_text_color #1a1b26
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.55
cursor_stop_blinking_after 12.0

# Scrollback and selection
scrollback_lines 20000
wheel_scroll_multiplier 3.0
copy_on_select clipboard
strip_trailing_spaces smart
select_by_word_characters @-./_~?&=%+#

# Terminal behavior
term xterm-kitty
linux_display_server x11
enable_audio_bell no
visual_bell_duration 0.0
bell_on_tab no
shell_integration enabled
editor nvim
allow_remote_control yes

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template "{index} {tab.active_wd.rsplit('/', 1)[-1] or '/'}"
active_tab_foreground   #1a1b26
active_tab_background   #7aa2f7
inactive_tab_foreground #a9b1d6
inactive_tab_background #292e42
tab_bar_background      #16161e

# Layout
enabled_layouts tall:bias=60;full_size=1;mirrored=false,stack,grid

# Mouse
mouse_hide_wait 2.0
url_style curly
open_url_with default

# Key bindings
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+shift+y     launch --type=tab --cwd=current yazi
map ctrl+shift+w     close_tab
map ctrl+h           previous_tab
map ctrl+l           next_tab
map ctrl+1           goto_tab 1
map ctrl+2           goto_tab 2
map ctrl+3           goto_tab 3
map ctrl+4           goto_tab 4
map ctrl+5           goto_tab 5
map ctrl+6           goto_tab 6
map ctrl+7           goto_tab 7
map ctrl+8           goto_tab 8
map ctrl+9           goto_tab 9
map ctrl+shift+h     neighboring_window left
map ctrl+shift+j     neighboring_window down
map ctrl+shift+k     neighboring_window up
map ctrl+shift+l     neighboring_window right
map ctrl+shift+plus  change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0     change_font_size all 0

# Tokyonight Night
foreground #c0caf5
background #1a1b26
selection_foreground #c0caf5
selection_background #33467c

url_color #73daca
active_border_color #7aa2f7
inactive_border_color #7aa2f7
bell_border_color #e0af68
visual_bell_color none

wayland_titlebar_color background
macos_titlebar_color background

mark1_foreground #1a1b26
mark1_background #7aa2f7
mark2_foreground #1a1b26
mark2_background #bb9af7
mark3_foreground #1a1b26
mark3_background #9ece6a

# black
color0  #15161e
color8  #414868

# red
color1  #f7768e
color9  #f7768e

# green
color2  #9ece6a
color10 #9ece6a

# yellow
color3  #e0af68
color11 #e0af68

# blue
color4  #7aa2f7
color12 #7aa2f7

# magenta
color5  #bb9af7
color13 #bb9af7

# cyan
color6  #7dcfff
color14 #7dcfff

# white
color7  #a9b1d6
color15 #c0caf5
